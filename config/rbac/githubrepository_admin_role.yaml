# This rule is not used by the project github-platform-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over github.k8sready.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: github-platform-operator
    app.kubernetes.io/managed-by: kustomize
  name: githubrepository-admin-role
rules:
- apiGroups:
  - github.k8sready.com
  resources:
  - githubrepositories
  verbs:
  - '*'
- apiGroups:
  - github.k8sready.com
  resources:
  - githubrepositories/status
  verbs:
  - get
