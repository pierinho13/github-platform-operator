---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - github.k8sready.com
  resources:
  - githubproviderconfigs
  - githubrepositories
  - githubrepositorycollaborators
  - githubrepositoryteamaccesses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - github.k8sready.com
  resources:
  - githubproviderconfigs/finalizers
  - githubrepositories/finalizers
  - githubrepositorycollaborators/finalizers
  - githubrepositoryteamaccesses/finalizers
  verbs:
  - update
- apiGroups:
  - github.k8sready.com
  resources:
  - githubproviderconfigs/status
  - githubrepositories/status
  - githubrepositorycollaborators/status
  - githubrepositoryteamaccesses/status
  verbs:
  - get
  - patch
  - update
