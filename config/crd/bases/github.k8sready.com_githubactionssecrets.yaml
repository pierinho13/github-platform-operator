---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: githubactionssecrets.github.k8sready.com
spec:
  group: github.k8sready.com
  names:
    kind: GitHubActionsSecret
    listKind: GitHubActionsSecretList
    plural: githubactionssecrets
    shortNames:
    - ghsecret
    singular: githubactionssecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.targetScope
      name: Scope
      type: string
    - jsonPath: .status.repository
      name: Repository
      type: string
    - jsonPath: .status.environment
      name: Environment
      type: string
    - jsonPath: .spec.name
      name: Secret
      type: string
    - jsonPath: .spec.deletionPolicy
      name: Deletion Policy
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GitHubActionsSecret synchronizes a Kubernetes Secret value into
          GitHub Actions.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GitHubActionsSecretSpec defines a GitHub Actions secret sourced
              from Kubernetes.
            properties:
              deletionPolicy:
                default: Orphan
                description: DeletionPolicy controls whether deleting this resource
                  revokes the GitHub secret.
                enum:
                - Orphan
                - Revoke
                type: string
              name:
                description: Name is the GitHub Actions secret name.
                minLength: 1
                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              target:
                description: Target selects a repository, environment, or organization.
                properties:
                  environmentRef:
                    description: EnvironmentRef targets a GitHubEnvironment in the
                      same namespace.
                    properties:
                      name:
                        description: Name is the Kubernetes metadata.name of the GitHubEnvironment.
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: environmentRef.name is immutable
                          rule: self == oldSelf
                    required:
                    - name
                    type: object
                  organization:
                    description: Organization targets the organization configured
                      by a GitHubProviderConfig.
                    properties:
                      providerConfigRef:
                        default: default
                        description: ProviderConfigRef references the cluster-scoped
                          GitHubProviderConfig.
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: providerConfigRef is immutable
                          rule: self == oldSelf
                      selectedRepositoryRefs:
                        description: |-
                          SelectedRepositoryRefs contains GitHubRepository resources in the same
                          namespace. It is used only when visibility is selected.
                        items:
                          description: GitHubRepositoryReference references a GitHubRepository
                            in the same namespace.
                          properties:
                            name:
                              description: Name is the Kubernetes name of the GitHubRepository.
                              maxLength: 253
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: repositoryRef.name is immutable
                                rule: self == oldSelf
                          required:
                          - name
                          type: object
                        maxItems: 100
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      visibility:
                        default: private
                        description: Visibility controls which repositories can consume
                          the organization value.
                        enum:
                        - all
                        - private
                        - selected
                        type: string
                    type: object
                  repositoryRef:
                    description: RepositoryRef targets a GitHubRepository in the same
                      namespace.
                    properties:
                      name:
                        description: Name is the Kubernetes name of the GitHubRepository.
                        maxLength: 253
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: repositoryRef.name is immutable
                          rule: self == oldSelf
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one target must be configured
                  rule: '((has(self.repositoryRef) ? 1 : 0) + (has(self.environmentRef)
                    ? 1 : 0) + (has(self.organization) ? 1 : 0)) == 1'
              valueFrom:
                description: ValueFrom selects the Kubernetes Secret value. Plaintext
                  values are not supported.
                properties:
                  secretKeyRef:
                    description: SecretKeyRef selects a value from a Kubernetes Secret
                      in the same namespace.
                    properties:
                      key:
                        description: Key is the Secret data key.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - secretKeyRef
                type: object
            required:
            - name
            - target
            - valueFrom
            type: object
          status:
            description: GitHubActionsSecretStatus defines the observed secret synchronization
              state.
            properties:
              conditions:
                description: Conditions describe the reconciliation state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              environment:
                description: Environment is the resolved environment name when applicable.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation most recently reconciled.
                format: int64
                type: integer
              organization:
                description: Organization is the resolved organization.
                type: string
              providerConfigRef:
                description: ProviderConfigRef is the resolved provider.
                type: string
              remoteUpdatedAt:
                description: RemoteUpdatedAt is the GitHub metadata timestamp observed
                  after synchronization.
                type: string
              repository:
                description: Repository is the resolved repository name when applicable.
                type: string
              secretName:
                description: SecretName is the synchronized GitHub secret name.
                type: string
              sourceSecretResourceVersion:
                description: SourceSecretResourceVersion is the synchronized Kubernetes
                  Secret resource version.
                type: string
              sourceSecretUid:
                description: SourceSecretUID identifies the Kubernetes Secret used
                  during synchronization.
                type: string
              targetScope:
                description: TargetScope is repository, environment, or organization.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
