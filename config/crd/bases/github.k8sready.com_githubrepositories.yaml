---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: githubrepositories.github.k8sready.com
spec:
  group: github.k8sready.com
  names:
    kind: GitHubRepository
    listKind: GitHubRepositoryList
    plural: githubrepositories
    shortNames:
    - ghrepo
    singular: githubrepository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerConfigRef
      name: Provider
      type: string
    - jsonPath: .status.organization
      name: Organization
      type: string
    - jsonPath: .spec.name
      name: Repository
      type: string
    - jsonPath: .status.visibility
      name: Visibility
      type: string
    - jsonPath: .spec.deletionPolicy
      name: Deletion Policy
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GitHubRepository is the Schema for the githubrepositories API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GitHubRepositorySpec defines the desired state of GitHubRepository.
            properties:
              autoInit:
                description: |-
                  AutoInit creates an initial commit with an empty README. It is only used when
                  creating a repository and cannot be changed afterwards.
                type: boolean
                x-kubernetes-validations:
                - message: autoInit is immutable
                  rule: self == oldSelf
              deleteBranchOnMerge:
                description: DeleteBranchOnMerge controls automatic deletion of merged
                  head branches.
                type: boolean
              deletionPolicy:
                default: Orphan
                description: |-
                  DeletionPolicy determines whether deleting the custom resource orphans,
                  archives or permanently deletes the remote GitHub repository.
                enum:
                - Orphan
                - Archive
                - Delete
                type: string
              description:
                description: |-
                  Description is the short repository description. When omitted, the operator
                  preserves the current value. Set it to an empty string to clear it.
                type: string
              features:
                description: |-
                  Features contains optional repository features. Only fields explicitly set
                  inside this object are reconciled.
                properties:
                  discussions:
                    description: Discussions controls whether GitHub Discussions are
                      enabled.
                    type: boolean
                  issues:
                    description: Issues controls whether GitHub Issues are enabled.
                    type: boolean
                  projects:
                    description: Projects controls whether GitHub Projects are enabled.
                    type: boolean
                  wiki:
                    description: Wiki controls whether the repository wiki is enabled.
                    type: boolean
                type: object
              homepage:
                description: |-
                  Homepage is the repository website URL. When omitted, the operator preserves
                  the current value. Set it to an empty string to clear it.
                type: string
              isTemplate:
                description: IsTemplate controls whether this repository can be used
                  as a template.
                type: boolean
              mergeOptions:
                description: MergeOptions contains optional pull-request merge settings.
                properties:
                  allowAutoMerge:
                    description: AllowAutoMerge controls whether pull requests can
                      use auto-merge.
                    type: boolean
                  allowMergeCommit:
                    description: AllowMergeCommit controls whether merge commits are
                      allowed.
                    type: boolean
                  allowRebaseMerge:
                    description: AllowRebaseMerge controls whether rebase merges are
                      allowed.
                    type: boolean
                  allowSquashMerge:
                    description: AllowSquashMerge controls whether squash merges are
                      allowed.
                    type: boolean
                  mergeCommitMessage:
                    description: MergeCommitMessage controls the default body for
                      merge commits.
                    enum:
                    - PR_BODY
                    - PR_TITLE
                    - BLANK
                    type: string
                  mergeCommitTitle:
                    description: MergeCommitTitle controls the default title for merge
                      commits.
                    enum:
                    - PR_TITLE
                    - MERGE_MESSAGE
                    type: string
                  squashMergeCommitMessage:
                    description: SquashMergeCommitMessage controls the default body
                      for squash merges.
                    enum:
                    - PR_BODY
                    - COMMIT_MESSAGES
                    - BLANK
                    type: string
                  squashMergeCommitTitle:
                    description: SquashMergeCommitTitle controls the default title
                      for squash merges.
                    enum:
                    - PR_TITLE
                    - COMMIT_OR_PR_TITLE
                    type: string
                type: object
              name:
                description: Name is the name of the GitHub repository.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              organization:
                description: |-
                  Organization is deprecated and ignored. Configure the organization through
                  GitHubProviderConfig instead. It is temporarily retained for v1alpha1 migration.
                type: string
                x-kubernetes-validations:
                - message: organization is immutable
                  rule: self == oldSelf
              providerConfigRef:
                default: default
                description: ProviderConfigRef references the cluster-scoped GitHubProviderConfig.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: providerConfigRef is immutable
                  rule: self == oldSelf
              template:
                description: |-
                  Template creates the repository from an existing template. It is only used
                  during creation and cannot be changed afterwards.
                properties:
                  includeAllBranches:
                    description: IncludeAllBranches copies every branch instead of
                      only the default branch.
                    type: boolean
                  owner:
                    description: Owner is the user or organization that owns the template
                      repository.
                    minLength: 1
                    type: string
                  repository:
                    description: Repository is the template repository name.
                    minLength: 1
                    type: string
                required:
                - owner
                - repository
                type: object
                x-kubernetes-validations:
                - message: template is immutable
                  rule: self == oldSelf
              topics:
                description: |-
                  Topics is the complete set of repository topics managed by the operator.
                  When omitted, existing topics are preserved. Set an empty list to clear all topics.
                  GitHub stores topic names in lowercase.
                items:
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: set
              visibility:
                description: |-
                  Visibility determines whether the operator manages the repository visibility.
                  When omitted, new repositories are created as private, while existing repositories
                  keep their current visibility. Internal visibility requires GitHub Enterprise.
                enum:
                - public
                - private
                - internal
                type: string
              vulnerabilityAlerts:
                description: |-
                  VulnerabilityAlerts controls dependency graph vulnerability alerts. This
                  setting requires repository Administration permission.
                type: boolean
            required:
            - name
            type: object
            x-kubernetes-validations:
            - message: template and autoInit are mutually exclusive
              rule: '!(has(self.template) && has(self.autoInit))'
          status:
            description: GitHubRepositoryStatus defines the observed state of GitHubRepository.
            properties:
              archived:
                description: Archived indicates whether GitHub reports the repository
                  as archived.
                type: boolean
              conditions:
                description: Conditions describe the current reconciliation state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deleteBranchOnMerge:
                description: DeleteBranchOnMerge is the observed merged-branch cleanup
                  setting.
                type: boolean
              description:
                description: Description is the repository description last observed
                  in GitHub.
                type: string
              features:
                description: Features contains repository feature values last observed
                  in GitHub.
                properties:
                  discussions:
                    type: boolean
                  issues:
                    type: boolean
                  projects:
                    type: boolean
                  wiki:
                    type: boolean
                required:
                - discussions
                - issues
                - projects
                - wiki
                type: object
              homepage:
                description: Homepage is the repository homepage last observed in
                  GitHub.
                type: string
              isTemplate:
                description: IsTemplate is the observed template-repository setting.
                type: boolean
              mergeOptions:
                description: MergeOptions contains merge settings observed in GitHub.
                properties:
                  allowAutoMerge:
                    type: boolean
                  allowMergeCommit:
                    type: boolean
                  allowRebaseMerge:
                    type: boolean
                  allowSquashMerge:
                    type: boolean
                  mergeCommitMessage:
                    description: RepositoryMergeCommitMessage defines the default
                      merge-commit message format.
                    enum:
                    - PR_BODY
                    - PR_TITLE
                    - BLANK
                    type: string
                  mergeCommitTitle:
                    description: RepositoryMergeCommitTitle defines the default merge-commit
                      title format.
                    enum:
                    - PR_TITLE
                    - MERGE_MESSAGE
                    type: string
                  squashMergeCommitMessage:
                    description: RepositorySquashMergeCommitMessage defines the default
                      squash-merge message format.
                    enum:
                    - PR_BODY
                    - COMMIT_MESSAGES
                    - BLANK
                    type: string
                  squashMergeCommitTitle:
                    description: RepositorySquashMergeCommitTitle defines the default
                      squash-merge title format.
                    enum:
                    - PR_TITLE
                    - COMMIT_OR_PR_TITLE
                    type: string
                required:
                - allowAutoMerge
                - allowMergeCommit
                - allowRebaseMerge
                - allowSquashMerge
                type: object
              observedGeneration:
                description: ObservedGeneration is the GitHubRepository generation
                  most recently reconciled.
                format: int64
                type: integer
              organization:
                description: Organization is the GitHub organization last observed
                  from the provider configuration.
                type: string
              providerConfigRef:
                description: ProviderConfigRef is the provider configuration used
                  during reconciliation.
                type: string
              repositoryId:
                description: RepositoryID is the numeric identifier assigned by GitHub.
                format: int64
                type: integer
              topics:
                description: Topics is the repository topic set last observed in GitHub.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              url:
                description: URL is the HTML URL of the GitHub repository.
                type: string
              visibility:
                description: Visibility is the repository visibility last observed
                  in GitHub.
                enum:
                - public
                - private
                - internal
                type: string
              vulnerabilityAlerts:
                description: VulnerabilityAlerts is populated when spec.vulnerabilityAlerts
                  is managed.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
