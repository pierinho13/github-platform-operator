---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: githubrepositoryrulesets.github.k8sready.com
spec:
  group: github.k8sready.com
  names:
    kind: GitHubRepositoryRuleset
    listKind: GitHubRepositoryRulesetList
    plural: githubrepositoryrulesets
    shortNames:
    - ghruleset
    singular: githubrepositoryruleset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.repository
      name: Repository
      type: string
    - jsonPath: .spec.name
      name: Ruleset
      type: string
    - jsonPath: .spec.target
      name: Target
      type: string
    - jsonPath: .spec.enforcement
      name: Enforcement
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GitHubRepositoryRuleset is the Schema for GitHub repository rulesets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GitHubRepositoryRulesetSpec defines a repository ruleset.
            properties:
              bypassActors:
                description: |-
                  BypassActors lists actors that may bypass the ruleset. Omit the field to leave
                  bypass actors unmanaged, or set an empty list to remove all bypass actors.
                items:
                  description: |-
                    GitHubRulesetBypassActor defines an actor that can bypass a ruleset.

                    Team and User actors may use a stable human-readable identifier instead of
                    looking up GitHub's numeric actor ID manually. actorID remains supported for
                    backward compatibility and for actor types without a name resolver.
                  properties:
                    actorID:
                      description: |-
                        ActorID is the numeric GitHub actor ID. It may be used for Team and User
                        instead of teamSlug or username, and is required for Integration and
                        RepositoryRole. It must be omitted for OrganizationAdmin and DeployKey.
                      format: int64
                      minimum: 1
                      type: integer
                    actorType:
                      description: ActorType is the GitHub actor type.
                      enum:
                      - Integration
                      - OrganizationAdmin
                      - RepositoryRole
                      - Team
                      - DeployKey
                      - User
                      type: string
                    bypassMode:
                      default: always
                      description: BypassMode controls when bypass is permitted.
                      enum:
                      - always
                      - pull_request
                      - exempt
                      type: string
                    teamSlug:
                      description: |-
                        TeamSlug identifies a team in the provider organization. It is resolved
                        to GitHub's numeric team ID before the ruleset request is sent.
                      minLength: 1
                      type: string
                    username:
                      description: |-
                        Username identifies a GitHub user by login. It is resolved to GitHub's
                        numeric user ID before the ruleset request is sent.
                      minLength: 1
                      type: string
                  required:
                  - actorType
                  type: object
                  x-kubernetes-validations:
                  - message: Team requires exactly one of actorID or teamSlug, and
                      username must be omitted
                    rule: self.actorType != 'Team' || (has(self.actorID) != has(self.teamSlug))
                      && !has(self.username)
                  - message: User requires exactly one of actorID or username, and
                      teamSlug must be omitted
                    rule: self.actorType != 'User' || (has(self.actorID) != has(self.username))
                      && !has(self.teamSlug)
                  - message: Integration and RepositoryRole require actorID and do
                      not accept teamSlug or username
                    rule: '!(self.actorType in [''Integration'', ''RepositoryRole''])
                      || has(self.actorID) && !has(self.teamSlug) && !has(self.username)'
                  - message: OrganizationAdmin and DeployKey do not accept actorID,
                      teamSlug, or username
                    rule: '!(self.actorType in [''OrganizationAdmin'', ''DeployKey''])
                      || !has(self.actorID) && !has(self.teamSlug) && !has(self.username)'
                type: array
              conditions:
                description: |-
                  Conditions selects refs affected by the ruleset. When omitted, existing
                  conditions are not compared or changed.
                properties:
                  refName:
                    description: RefName selects branch or tag refs.
                    properties:
                      exclude:
                        description: Exclude contains ref names or patterns that must
                          not match.
                        items:
                          type: string
                        type: array
                      include:
                        description: Include contains ref names or patterns. ~DEFAULT_BRANCH
                          and ~ALL are supported.
                        items:
                          type: string
                        minItems: 1
                        type: array
                    required:
                    - include
                    type: object
                type: object
              deletionPolicy:
                default: Orphan
                description: |-
                  DeletionPolicy controls whether deleting this custom resource deletes
                  the GitHub ruleset.
                enum:
                - Orphan
                - Delete
                type: string
              enforcement:
                description: Enforcement is disabled, active, or evaluate.
                enum:
                - disabled
                - active
                - evaluate
                type: string
              name:
                description: Name is the GitHub ruleset name.
                minLength: 1
                type: string
              repositoryRef:
                description: RepositoryRef references the repository custom resource.
                properties:
                  name:
                    description: Name is the Kubernetes name of the GitHubRepository.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: repositoryRef.name is immutable
                      rule: self == oldSelf
                required:
                - name
                type: object
              rules:
                description: Rules contains the complete desired ruleset rule list.
                items:
                  description: |-
                    GitHubRulesetRule defines one rule. Parameters are passed directly to the
                    GitHub API and therefore support every current parameter shape.
                    Examples include pull_request, merge_queue, required_status_checks,
                    workflows, code_scanning, pattern rules, and push restriction rules.
                  properties:
                    parameters:
                      description: |-
                        Parameters contains the rule-specific GitHub API object.
                        Omit it for parameterless rules.
                      x-kubernetes-preserve-unknown-fields: true
                    type:
                      description: Type is the GitHub rule type.
                      enum:
                      - creation
                      - update
                      - deletion
                      - required_linear_history
                      - merge_queue
                      - required_deployments
                      - required_signatures
                      - pull_request
                      - required_status_checks
                      - non_fast_forward
                      - commit_message_pattern
                      - commit_author_email_pattern
                      - committer_email_pattern
                      - branch_name_pattern
                      - tag_name_pattern
                      - workflows
                      - code_scanning
                      - copilot_code_review
                      - license_compliance_scanning
                      - file_path_restriction
                      - max_file_path_length
                      - file_extension_restriction
                      - max_file_size
                      type: string
                  required:
                  - type
                  type: object
                minItems: 1
                type: array
              target:
                default: branch
                description: Target is branch, tag, or push.
                enum:
                - branch
                - tag
                - push
                type: string
            required:
            - enforcement
            - name
            - repositoryRef
            - rules
            type: object
          status:
            description: GitHubRepositoryRulesetStatus defines the observed ruleset
              state.
            properties:
              conditions:
                description: Conditions describe whether the ruleset is synchronized.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              enforcement:
                description: Enforcement is the observed enforcement state.
                enum:
                - disabled
                - active
                - evaluate
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation most recently reconciled.
                format: int64
                type: integer
              organization:
                description: Organization is the resolved GitHub organization.
                type: string
              providerConfigRef:
                description: ProviderConfigRef is the resolved provider.
                type: string
              repository:
                description: Repository is the resolved GitHub repository.
                type: string
              rulesetID:
                description: RulesetID is the GitHub ruleset ID.
                format: int64
                type: integer
              rulesetName:
                description: RulesetName is the observed GitHub ruleset name.
                type: string
              target:
                description: Target is the observed target.
                enum:
                - branch
                - tag
                - push
                type: string
              url:
                description: URL is the GitHub web URL for the ruleset when GitHub
                  returns it.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
