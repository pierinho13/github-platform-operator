name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Go modules
        run: go mod verify

      - name: Generate code and manifests
        run: make generate manifests

      - name: Format code
        run: make fmt

      - name: Run tests
        run: make test

      - name: Check generated and formatted files
        shell: bash
        run: |
          set -euo pipefail

          changes="$(git status --porcelain)"

          if [[ -n "${changes}" ]]; then
            echo "Generated or formatted files are not up to date."
            echo
            echo "Changed files:"
            printf '%s\n' "${changes}"
            echo
            echo "Diff:"
            git diff -- .
            echo
            echo "Run locally:"
            echo
            echo "  make generate manifests"
            echo "  make fmt"
            echo
            echo "Then commit the generated changes."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  release-snapshot:
    name: Validate Helm and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - test
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Generate code and manifests
        run: make generate manifests

      - name: Format code
        run: make fmt

      - name: Verify generated files are committed
        shell: bash
        run: |
          set -euo pipefail

          changes="$(git status --porcelain)"

          if [[ -n "${changes}" ]]; then
            echo "The snapshot release produced uncommitted generated changes."
            echo
            printf '%s\n' "${changes}"
            echo
            git diff -- .
            echo
            echo "Run and commit:"
            echo
            echo "  make generate manifests"
            echo "  make fmt"
            exit 1
          fi

      - name: Validate and package Helm chart
        shell: bash
        run: |
          set -euo pipefail

          ./hack/package-helm-chart.sh \
            0.0.0-snapshot \
            v0.0.0-snapshot

      - name: Verify packaged Helm chart
        shell: bash
        run: |
          set -euo pipefail

          chart="dist/helm/github-platform-operator-0.0.0-snapshot.tgz"
          rendered="$(mktemp)"

          test -f "${chart}"
          tar -tzf "${chart}"

          helm template \
            github-platform-operator \
            "${chart}" \
            --namespace github-platform-operator-system \
            > "${rendered}"

          if ! awk '
            function finish_document() {
              if (is_cluster_role && has_ruleset && has_ruleset_status && has_ruleset_finalizers) {
                found = 1
              }

              is_cluster_role = 0
              has_ruleset = 0
              has_ruleset_status = 0
              has_ruleset_finalizers = 0
            }

            /^---[[:space:]]*$/ {
              finish_document()
              next
            }

            /^[[:space:]]*kind:[[:space:]]*ClusterRole[[:space:]]*$/ {
              is_cluster_role = 1
            }

            is_cluster_role &&
            /^[[:space:]]*-[[:space:]]*githubrepositoryrulesets[[:space:]]*$/ {
              has_ruleset = 1
            }

            is_cluster_role &&
            /githubrepositoryrulesets\/status/ {
              has_ruleset_status = 1
            }

            is_cluster_role &&
            /githubrepositoryrulesets\/finalizers/ {
              has_ruleset_finalizers = 1
            }

            END {
              finish_document()
              exit(found ? 0 : 1)
            }
          ' "${rendered}"; then
            echo "The packaged Helm chart does not contain the complete GitHubRepositoryRuleset RBAC." >&2
            echo "Check config/rbac/role.yaml and hack/package-helm-chart.sh." >&2
            exit 1
          fi

          echo "GitHubRepositoryRuleset RBAC is present in the packaged chart."

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish release

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - test
      - lint
      - release-snapshot

    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    uses: ./.github/workflows/release.yaml
    secrets: inherit