name: Publish release

on:
  workflow_call:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: github-platform-operator-release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/pierinho13/github-platform-operator
  HELM_REGISTRY: oci://ghcr.io/pierinho13/charts

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Generate code and manifests
        run: make generate manifests

      - name: Format code
        run: make fmt

      - name: Verify generated files are committed
        shell: bash
        run: |
          set -euo pipefail

          changes="$(git status --porcelain)"

          if [[ -n "${changes}" ]]; then
            echo "Release generation produced uncommitted changes." >&2
            echo >&2
            printf '%s\n' "${changes}" >&2
            echo >&2
            git diff -- .
            echo >&2
            echo "Run and commit:" >&2
            echo >&2
            echo "  make generate manifests" >&2
            echo "  make fmt" >&2
            exit 1
          fi

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Publish Artifact Hub repository metadata
        shell: bash
        env:
          CONFIG_MEDIA_TYPE: application/vnd.cncf.artifacthub.config.v1+yaml
          METADATA_MEDIA_TYPE: >-
            application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" |
            oras login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

          oras push \
            ghcr.io/pierinho13/charts/github-platform-operator:artifacthub.io \
            --config "/dev/null:${CONFIG_MEDIA_TYPE}" \
            "artifacthub-repo.yml:${METADATA_MEDIA_TYPE}"

      - name: Install semantic version utility
        shell: bash
        env:
          SVU_VERSION: v3.2.3
        run: |
          set -euo pipefail

          go install "github.com/caarlos0/svu/v3@${SVU_VERSION}"

          svu_bin="$(go env GOPATH)/bin"
          echo "${svu_bin}" >> "${GITHUB_PATH}"

          "${svu_bin}/svu" --version

      - name: Resolve next release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Allows a failed publication to resume when the tag already points
          # to the current commit but the GitHub Release does not yet exist.
          head_tag="$(
            git tag \
              --points-at HEAD \
              --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1 || true
          )"

          if [[ -n "${head_tag}" ]]; then
            if gh release view "${head_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              >/dev/null 2>&1; then

              echo "Release ${head_tag} already exists."
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Resuming incomplete release ${head_tag}."
            tag="${head_tag}"
          else
            current_tag="$(
              git tag \
                --merged HEAD \
                --sort=-v:refname |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
                head -n 1 || true
            )"

            current_tag="${current_tag:-v0.0.0}"
            tag="$(svu next)"

            if [[ "${tag}" == "${current_tag}" ]]; then
              echo "No releasable Conventional Commits were found."
              echo "Current version: ${current_tag}"
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "svu returned an invalid version: ${tag}" >&2
            exit 1
          fi

          chart_version="${tag#v}"
          IFS='.' read -r major minor patch <<< "${chart_version}"

          {
            echo "publish=true"
            echo "tag=${tag}"
            echo "chart_version=${chart_version}"
            echo "major=${major}"
            echo "minor=${minor}"

            echo "image_tags<<EOF"
            echo "${IMAGE_NAME}:${tag}"
            echo "${IMAGE_NAME}:${chart_version}"
            echo "${IMAGE_NAME}:v${major}.${minor}"
            echo "${IMAGE_NAME}:v${major}"
            echo "${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "Next release: ${tag}"

      - name: Set up Helm
        if: steps.version.outputs.publish == 'true'
        uses: azure/setup-helm@v5

      - name: Configure Helm chart signing
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.HELM_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.HELM_SIGNING_PASSPHRASE }}
          SIGNING_FINGERPRINT: DBBC4A49D2BB68565A9BCC383CA8825330932B17
        run: |
          set -euo pipefail

          if [[ -z "${PRIVATE_KEY}" || -z "${PRIVATE_KEY_PASSPHRASE}" ]]; then
            echo "Helm signing secrets are not configured." >&2
            exit 1
          fi

          signing_home="${RUNNER_TEMP}/helm-signing-gnupg"
          signing_keyring="${RUNNER_TEMP}/helm-signing-keyring.gpg"
          verification_keyring="${RUNNER_TEMP}/helm-verification-keyring.gpg"
          passphrase_file="${RUNNER_TEMP}/helm-signing-passphrase"

          mkdir --mode=700 "${signing_home}"
          printf '%s' "${PRIVATE_KEY_PASSPHRASE}" > "${passphrase_file}"
          chmod 600 "${passphrase_file}"

          printf '%s' "${PRIVATE_KEY}" |
            gpg --homedir "${signing_home}" --batch --import

          gpg \
            --homedir "${signing_home}" \
            --batch \
            --pinentry-mode loopback \
            --passphrase-file "${passphrase_file}" \
            --output "${signing_keyring}" \
            --export-secret-keys "${SIGNING_FINGERPRINT}"

          gpg \
            --homedir "${signing_home}" \
            --batch \
            --output "${verification_keyring}" \
            --export "${SIGNING_FINGERPRINT}"

          {
            echo "HELM_SIGNING_KEY=pierinho13@gmail.com"
            echo "HELM_SIGNING_KEYRING=${signing_keyring}"
            echo "HELM_SIGNING_PASSPHRASE_FILE=${passphrase_file}"
            echo "HELM_VERIFY_KEYRING=${verification_keyring}"
          } >> "${GITHUB_ENV}"

      - name: Build Helm chart
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          ./hack/package-release-helm-chart.sh \
            "${CHART_VERSION}" \
            "${APP_VERSION}"

      - name: Verify packaged Helm chart
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          set -euo pipefail

          chart="dist/helm/github-platform-operator-${CHART_VERSION}.tgz"
          provenance="${chart}.prov"
          archive_listing="$(mktemp)"
          rendered="$(mktemp)"

          test -f "${chart}"
          test -f "${provenance}"
          helm verify "${chart}" --keyring "${HELM_VERIFY_KEYRING}"
          tar -tzf "${chart}" > "${archive_listing}"
          cat "${archive_listing}"

          if ! grep -Fx 'github-platform-operator/values.schema.json' \
            "${archive_listing}" >/dev/null; then

            echo "The packaged Helm chart does not contain values.schema.json." >&2
            exit 1
          fi

          helm template \
            github-platform-operator \
            "${chart}" \
            --namespace github-platform-operator-system \
            > "${rendered}"

          if ! awk '
            function finish_document() {
              if (is_cluster_role && has_ruleset && has_ruleset_status && has_ruleset_finalizers) {
                found = 1
              }

              is_cluster_role = 0
              has_ruleset = 0
              has_ruleset_status = 0
              has_ruleset_finalizers = 0
            }

            /^---[[:space:]]*$/ {
              finish_document()
              next
            }

            /^[[:space:]]*kind:[[:space:]]*ClusterRole[[:space:]]*$/ {
              is_cluster_role = 1
            }

            is_cluster_role &&
            /^[[:space:]]*-[[:space:]]*githubrepositoryrulesets[[:space:]]*$/ {
              has_ruleset = 1
            }

            is_cluster_role &&
            /githubrepositoryrulesets\/status/ {
              has_ruleset_status = 1
            }

            is_cluster_role &&
            /githubrepositoryrulesets\/finalizers/ {
              has_ruleset_finalizers = 1
            }

            END {
              finish_document()
              exit(found ? 0 : 1)
            }
          ' "${rendered}"; then
            echo "The packaged Helm chart does not contain the complete GitHubRepositoryRuleset RBAC." >&2
            echo "Publishing has been stopped." >&2
            echo "Check config/rbac/role.yaml and hack/package-release-helm-chart.sh." >&2
            exit 1
          fi

          echo "GitHubRepositoryRuleset RBAC is present in the packaged chart."

      - name: Validate GoReleaser configuration
        if: steps.version.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Set up QEMU
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        if: steps.version.outputs.publish == 'true'
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/pierinho13/github-platform-operator
            org.opencontainers.image.description=Kubernetes operator for managing GitHub repositories, access and Actions configuration
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate container provenance
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Log in to GHCR for Helm
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish Helm chart
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          set -euo pipefail

          chart="dist/helm/github-platform-operator-${CHART_VERSION}.tgz"

          if helm show chart \
            "${HELM_REGISTRY}/github-platform-operator" \
            --version "${CHART_VERSION}" \
            >/dev/null 2>&1; then

            echo "Helm chart ${CHART_VERSION} is already published."
          else
            helm push "${chart}" "${HELM_REGISTRY}"
          fi

      - name: Create release tag
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"

            if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${RELEASE_TAG} already points to another commit." >&2
              echo "Expected: ${GITHUB_SHA}" >&2
              echo "Actual:   ${tag_commit}" >&2
              exit 1
            fi

            echo "Tag ${RELEASE_TAG} already points to this commit."
          else
            git tag \
              --annotate "${RELEASE_TAG}" \
              --message "Release ${RELEASE_TAG}"
          fi

          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub release with GoReleaser
        if: steps.version.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No release required
        if: steps.version.outputs.publish != 'true'
        run: |
          echo "CI passed, but the commits do not require a new semantic version."
