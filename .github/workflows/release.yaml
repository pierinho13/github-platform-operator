name: Publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/pierinho13/github-platform-operator
  HELM_REGISTRY: oci://ghcr.io/pierinho13/charts

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          tag="${REQUESTED_VERSION}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the format vMAJOR.MINOR.PATCH, for example v0.1.0" >&2
            exit 1
          fi

          chart_version="${tag#v}"
          IFS='.' read -r major minor patch <<< "${chart_version}"

          {
            echo "tag=${tag}"
            echo "chart_version=${chart_version}"
            echo "major=${major}"
            echo "minor=${minor}"
            echo "image_tags<<EOF"
            echo "${IMAGE_NAME}:${tag}"
            echo "${IMAGE_NAME}:${chart_version}"
            echo "${IMAGE_NAME}:v${major}.${minor}"
            echo "${IMAGE_NAME}:v${major}"
            echo "${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate generated files and tests
        shell: bash
        run: |
          set -euo pipefail
          make generate manifests
          make fmt
          make vet
          make test
          git diff --exit-code

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build Helm chart
        shell: bash
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ./hack/package-helm-chart.sh "${CHART_VERSION}" "${APP_VERSION}"

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags
          if git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for container images
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/pierinho13/github-platform-operator
            org.opencontainers.image.description=Kubernetes operator for managing GitHub repositories, access and Actions configuration
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub release with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR for Helm
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish Helm chart
        shell: bash
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          set -euo pipefail
          helm push \
            "dist/helm/github-platform-operator-${CHART_VERSION}.tgz" \
            "${HELM_REGISTRY}"
