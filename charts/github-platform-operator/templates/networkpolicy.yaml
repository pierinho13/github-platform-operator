{{- if and .Values.networkPolicy.enabled .Values.metrics.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "github-platform-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-platform-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "github-platform-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.namespaceSelectorLabels | nindent 14 }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
{{- end }}
